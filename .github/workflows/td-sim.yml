name: td-sim

on:
  push:
    paths: ['td-sim/**', 'scripts/sync-td-sim.mjs', '.github/workflows/td-sim.yml']
  pull_request:
    paths: ['td-sim/**', 'scripts/sync-td-sim.mjs', '.github/workflows/td-sim.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable && yarn install --immutable
      - run: yarn td-sim:check
